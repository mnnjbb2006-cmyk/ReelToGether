<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <title>Log in — ReelTogether</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="landing-body auth-page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <nav class="nav wrap"><a class="brand" href="/"><span class="brand-mark">▶</span><span>reel<span class="brand-light">together</span></span></a><span class="nav-note">your friends. one screen.</span></nav>
  <main class="auth-main">
    <section class="entry-card auth-card">
      <div class="card-kicker">YOUR MOVIE NIGHT STARTS HERE</div>
      <h2>Welcome back.</h2>
      <p class="muted">Log in to create a room or join your friends.</p>
      <form id="auth-form" class="auth-form">
        <label class="field-label" for="username">USERNAME</label>
        <input id="username" class="text-field" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" required autocomplete="username" placeholder="Your username">
        <label class="field-label" for="password">PASSWORD</label>
        <input id="password" class="text-field" type="password" minlength="8" maxlength="128" required autocomplete="current-password" placeholder="Your password">
        <label class="remember-row"><input id="remember" type="checkbox"><span>Remember this device for 1 month</span></label>
        <button id="submit-button" class="primary-btn full-btn" type="submit">Log in <span class="btn-arrow">→</span></button>
        <div id="auth-error" class="form-error" role="alert"></div>
      </form>
      <p class="auth-switch">New to ReelTogether? <a href="/register">Create an account</a></p>
    </section>
  </main>
  <script>
    const form = document.getElementById('auth-form');
    const errorBox = document.getElementById('auth-error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); errorBox.textContent = '';
      const button = document.getElementById('submit-button'); button.disabled = true;
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value, remember: document.getElementById('remember').checked })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(Array.isArray(result.detail) ? result.detail.map(item => item.msg).join(' ') : (result.detail || 'Could not log in.'));
        window.location.href = {{ next_url | tojson }};
      } catch (error) { errorBox.textContent = error.message; button.disabled = false; }
    });
  </script>
</body>
</html>
