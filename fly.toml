# fly.toml app configuration file generated for reeltogether-bozqhq on 2026-11-24T17:30:55Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'reeltogether-bozqhq'
primary_region = 'ams'

[build]
[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
